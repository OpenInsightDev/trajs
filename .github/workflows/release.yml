name: Release

# Releases. Three triggers, one publish chain.
#
#   push to main            someone merged the Version Packages pull request by
#                           hand: publish that commit, exactly as before.
#   schedule                every day at 09:00 Asia/Shanghai the window asks
#                           whether the newest release is two days old, gates the
#                           pull request, merges it, and publishes the merge.
#   workflow_dispatch       the same, on demand; `dry_run` stops before merging.
#
# They meet at one condition on `select-mode` and one ref:
#
#   if:  !cancelled() && (event == push || merge.sha != '')
#   ref: merge.sha || github.sha
#
# An empty `merge.sha` means "the window was skipped" on a push — publish the
# triggered commit — and "nothing is due" on a timer — publish nothing. That
# distinction is why this needs no second workflow, no App token and no PAT.
#
# Two invariants must survive refactors:
#   1. `publish` stays in this file, at the top level. npm trusted publishing
#      matches the workflow filename recorded in each package's settings, and
#      with `workflow_call` it validates the *caller's* name instead.
#   2. The merge keeps using `GITHUB_TOKEN`. A `GITHUB_TOKEN` push starts no
#      run, which is what stops an automatic merge from publishing twice.

# Publishes the core libraries under `packages/` to npm. The release set comes
# from `.changeset/config.json`: `fixed` names the six core packages, which share
# one version, and `ignore` keeps the CLI, the extensions and the UI packages out
# until they are ready to be published.
#
# The jobs follow the Changesets trusted publishing flow: on a push to `main`,
# either a "Version Packages" pull request is opened or updated, or the packages
# the version merge left unpublished are packed and published. A push therefore
# never publishes anything by itself — merging that pull request is the release,
# and `.changeset/AGENTS.md` states how often one is cut. `id-token: write` is
# granted to the publish job alone, and npm exchanges that OIDC token for a
# short-lived credential, so the repository stores no npm token. `pre.json` keeps
# Changesets in pre mode, so the release is an `X.Y.Z-alpha.N` prerelease. It
# ships under the `latest` dist-tag, which is the tag `npm install` resolves; the
# version states the prerelease, and the `select-mode` job says why the tag is
# stated here instead of left to Changesets.

on:
  push:
    branches: [main]
  # The window decides the date; the push path keeps deciding nothing, because
  # a merge is a decision someone already made. Same file, so all three paths
  # share one concurrency group and cannot publish at the same time.
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Decide and gate, then stop before merging
        type: boolean
        default: false

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

# `cancel-in-progress` stays false, so a manual merge that just published makes
# the next timer wait its turn instead of being cancelled: it then finds a
# release younger than two days and stops at the window.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  window:
    name: Release window
    # Only the timer paths decide anything; a push already carries the decision.
    # The `main` check keeps a dispatch from a branch from merging into `main`:
    # such a run is green and does nothing, so a `dry_run` is dispatched on
    # `main` itself.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      due: ${{ steps.window.outputs.due }}
      number: ${{ steps.window.outputs.number }}
      sha: ${{ steps.window.outputs.sha }}
    steps:
      - name: Is a release due?
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --base main --head changeset-release/main --state open \
            --json number,headRefOid,isDraft \
            --jq 'map(select(.isDraft | not)) | first // empty')"
          if [ -z "$pr" ]; then
            echo "no open Version Packages pull request; nothing to release"
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number="$(jq -r .number <<<"$pr")"
          sha="$(jq -r .headRefOid <<<"$pr")"

          # Newest release across the `fixed` group: they stamp one version and
          # the API lists them newest first. A publish that failed wrote no
          # release, so the window retries tomorrow.
          last="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
            --json publishedAt --jq '.[0].publishedAt // empty')"
          if [ -n "$last" ]; then
            age_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          else
            age_days=9999
          fi

          echo "pull request #$number at $sha; last release ${last:-never} (${age_days}d ago)"
          if [ "$age_days" -lt 2 ]; then
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "due=true"
            echo "number=$number"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  gate:
    name: Pre-merge gate
    needs: window
    if: needs.window.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.window.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The same gate `pack` runs. It stays here because `main` has no branch
      # protection and no pull_request workflow: without it a broken version
      # commit would land and stall the publish.
      - run: pnpm exec vp check
      - run: pnpm exec vp run -r test --passWithNoTests
      - run: pnpm exec vp run -r build

  merge:
    name: Merge Version Packages
    needs: [window, gate]
    if: needs.window.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # merging is a contents write
      pull-requests: read
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      # `--match-head-commit` refuses if the pull request moved while the gate
      # ran, so exactly what was tested is what gets merged.
      - name: Merge the Version Packages pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.window.outputs.number }}
          SHA: ${{ needs.window.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: would merge #$PR at $SHA and publish"
            exit 0
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" \
            --squash --match-head-commit "$SHA"
          sha="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$sha"
          echo "merged #$PR as $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  select-mode:
    # Where the three paths meet. On `push`, `merge` was skipped, so the commit
    # to release is `github.sha` — the merge someone made by hand. On the timer
    # paths an empty `merge` output means "nothing to release", never "release
    # the commit the schedule fired on" (which predates the merge).
    needs: [merge]
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.merge.outputs.sha != '') }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      tagged-publish-plan-artifact-id: ${{ steps.tagged-publish-plan.outputs.artifact-id }}
      ref: ${{ steps.commit.outputs.sha }}
    permissions:
      contents: read # check out the repository
    steps:
      - id: commit
        run: echo "sha=${{ needs.merge.outputs.sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ steps.commit.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2
      # `select-mode` infers each package's npm tag from the registry, and its
      # two answers both apply to this release group: a package whose every
      # published version is an `alpha` prerelease counts as a first release and
      # goes to `latest`, while a package that carries a stable version keeps its
      # prereleases off `latest`. `@trajs/core` still carries the `0.0.0` it
      # published before pre mode, so the group split across both tags, and
      # `latest` for `@trajs/core` stopped at whichever release last set it. Nothing in the flow can be told a tag —
      # `publish-plan` takes no `--tag` and `publish` refuses one in pre and
      # artifact mode — but `publish` does read the tag from this plan, so the
      # plan is rewritten to name it for every release.
      - id: publish-plan
        if: steps.select-mode.outputs.mode == 'publish'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
          path: ${{ runner.temp }}/publish-plan
      - if: steps.select-mode.outputs.mode == 'publish'
        run: >-
          node scripts/publish-plan-tag.mjs
          "$RUNNER_TEMP/publish-plan/publish-plan.json" latest
      - id: tagged-publish-plan
        if: steps.select-mode.outputs.mode == 'publish'
        uses: actions/upload-artifact@v7
        with:
          name: publish-plan.tagged
          path: ${{ runner.temp }}/publish-plan/publish-plan.json
          if-no-files-found: error

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      version-dir-artifact-id: ${{ steps.version.outputs.version-dir-artifact-id }}
    permissions:
      contents: write # commit the version changes
      pull-requests: write # open or update the "Version Packages" pull request
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.select-mode.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          package-manager-cache: false # avoid cache poisoning
      - run: pnpm install --frozen-lockfile
      - id: version
        uses: changesets/action/version@v2

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.select-mode.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          package-manager-cache: false # avoid cache poisoning
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp run -r test --passWithNoTests
      - run: pnpm exec vp run -r build
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.tagged-publish-plan-artifact-id }}

  publish:
    # `select-mode` is in `needs` for the commit to check out: `pack` passes
    # along artifacts, not the ref.
    needs: [select-mode, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tags and GitHub releases
      id-token: write # authenticate the publish with npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.select-mode.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          package-manager-cache: false # avoid cache poisoning
      # `pnpm publish` then runs against the tarballs from the pack job, which
      # already carry the resolved `catalog:` and `workspace:` ranges.
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
