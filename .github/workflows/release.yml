name: Release

# Publishes the core libraries under `packages/` to npm. The release set comes
# from `.changeset/config.json`: `fixed` names the six core packages, which share
# one version, and `ignore` keeps the CLI, the extensions and the UI packages out
# until they are ready to be published.
#
# The jobs follow the Changesets trusted publishing flow: on a push to `main`,
# either a "Version Packages" pull request is opened or updated, or the packages
# the version merge left unpublished are packed and published. `id-token: write`
# is granted to the publish job alone, and npm exchanges that OIDC token for a
# short-lived credential, so the repository stores no npm token. `pre.json` keeps
# Changesets in pre mode, so the release is an `X.Y.Z-alpha.N` prerelease
# published under the `alpha` dist-tag.

on:
  push:
    branches: [main]

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      version-dir-artifact-id: ${{ steps.version.outputs.version-dir-artifact-id }}
    permissions:
      contents: write # commit the version changes
      pull-requests: write # open or update the "Version Packages" pull request
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          package-manager-cache: false # avoid cache poisoning
      - run: pnpm install --frozen-lockfile
      - id: version
        uses: changesets/action/version@v2

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          package-manager-cache: false # avoid cache poisoning
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp run -r test --passWithNoTests
      - run: pnpm exec vp run -r build
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tags and GitHub releases
      id-token: write # authenticate the publish with npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          package-manager-cache: false # avoid cache poisoning
      # `pnpm publish` then runs against the tarballs from the pack job, which
      # already carry the resolved `catalog:` and `workspace:` ranges.
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
