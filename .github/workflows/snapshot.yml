name: Snapshot

# Publishes an installable build of every commit with pkg-pr-new, so a change can
# be used before the next release window instead of shipping a release for it.
# pkg.pr.new hosts the tarballs itself — nothing here touches npm — and it comments
# the install URLs on the pull request of the branch it built.
#
# The trigger is the push rather than the pull request. A preview then exists from
# a branch's first commit instead of from the moment its pull request opens, and —
# what settled it — a push made with `GITHUB_TOKEN` starts no run at all, so the
# version pull request's branch never lands in GitHub's approval queue the way a
# `pull_request` run on it did. `branches-ignore` names that branch anyway: it only
# moves versions and changelogs, so there is nothing to install from it. A fork
# cannot push to this repository, so a fork's code is never packaged under this
# repository's name.
#
# This is what lets `.changeset/AGENTS.md` release every other day: the wait never
# blocks anyone from consuming a change.

on:
  push:
    branches-ignore: [changeset-release/**]

# Nothing is granted by default; the job asks for what it needs.
permissions: {}

# A newer commit makes the snapshot of the older one pointless, so it is
# cancelled rather than finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The packages are packed from their build output, as they are for a
      # release.
      - run: pnpm exec vp run -r build
      # `--pnpm` packs with `pnpm pack`, which is what resolves the `catalog:`
      # protocol in these manifests. `--previewVersion` states the tarball as
      # `0.0.0-preview-<sha>`, so a lockfile cannot mistake it for the `alpha`
      # version npm serves. `--commentWithSha` links the commit instead of the
      # pull request, so a URL keeps naming the build it was made for.
      - run: >-
          pnpm exec pkg-pr-new publish --pnpm --previewVersion
          --packageManager=pnpm --commentWithSha ./packages/*
