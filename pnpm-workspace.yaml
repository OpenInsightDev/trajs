packages:
  - apps/*
  - extensions/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/ai-openai-compat": ^4.0.2
  "@types/node": ^24
  effect: ^4.0.2
  typescript: ^7.0.2
  uuid: ^14.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vite-plus: 1.0.0-rc.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - effect@4.0.2
allowBuilds:
  esbuild: true
