packages:
  - ui/*
  - extensions/*
  - packages/*
  - apps/*
  - tools/*
  - examples/*
  - tests/*

catalogMode: prefer

catalog:
  "@anthropic-ai/tokenizer": ^0.0.4
  "@aws-sdk/client-s3": ^3.1159.0
  "@base-ui/react": ^1.9.0
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/ai-anthropic": ^4.1.0
  "@effect/ai-openai-compat": ^4.1.0
  "@effect/platform-node": ^4.1.0
  "@effect/vitest": ^4.1.0
  "@effect/sql-clickhouse": ^4.1.0
  "@fontsource-variable/geist": ^5.3.0
  "@fontsource/ibm-plex-mono": ^5.3.0
  "@fontsource/poppins": ^5.3.0
  "@fumapress/ai": ^1.2.1
  "@napi-rs/blake-hash": ^1.4.0
  "@noble/hashes": ^2.4.0
  "@shadcn/react": ^0.3.1
  "@streamdown/code": ^2.0.0
  "@structured-world/structured-zstd": ^0.2.6
  "@types/node": ^26.6.6
  "@webgpu/types": ^0.1.74
  blake3-wasm: ^2.1.5
  chdb: ^3.4.0
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cn: ^0.5.0
  effect: ^4.1.0
  gpt-tokenizer: ^4.1.0
  lucide-react: ^1.64.0
  next-themes: ^0.4.6
  pkg-pr-new: ^0.0.92
  react-json-view-lite: ^2.5.0
  react-resizable-panels: ^4.15.1
  shadcn: ^4.23.0
  sonner: ^2.0.8
  streamdown: ^2.7.1
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  uuid: ^14.0.3
  vite: npm:@voidzero-dev/vite-plus-core@^1.4.0
  vite-plus: ^1.4.0
  wrangler: ^4.155.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
allowedDeprecatedVersions:
  # `chdb` declares it but never imports it, and every version carries the notice.
  "@clickhouse/client-common": "1.23.0"
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
  - "@aws-sdk/*"
  - "@fumadocs/*"
  - fumadocs-core
  - fumadocs-mdx
  - fumapress
  - lucide-react
  - "@types/node"
  - react-resizable-panels
  - wrangler
  - miniflare
allowBuilds:
  # `chdb` states its install script as a no-op and ships its engine as the
  # prebuilt `@chdb/lib-*` package of the platform it runs on, so there is
  # nothing to build.
  chdb: false
  esbuild: true
  # `workerd` ships the Workers runtime binary that `wrangler` runs.
  workerd: true
