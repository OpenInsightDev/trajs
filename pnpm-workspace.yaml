packages:
  - ui/*
  - extensions/*
  - packages/*
  - apps/*
  - tools/*
  - examples/*
  - tests/*

catalogMode: prefer

catalog:
  "@anthropic-ai/tokenizer": ^0.0.4
  "@aws-sdk/client-s3": ^3.1147.0
  "@base-ui/react": ^1.9.0
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/ai-anthropic": ^4.0.6
  "@effect/ai-openai-compat": ^4.0.6
  # Pinned to the `effect` release the workspace is on: a `@effect/*` package peers
  # on the `effect` line it shares, so it moves with `effect`, not ahead of it.
  "@effect/platform-node": 4.0.6
  "@effect/vitest": 4.0.6
  "@effect/sql-clickhouse": 4.0.6
  "@fontsource-variable/geist": ^5.3.0
  "@fontsource/ibm-plex-mono": ^5.3.0
  "@fontsource/poppins": ^5.3.0
  "@fumapress/ai": ^1.2.1
  "@napi-rs/blake-hash": ^1.4.0
  "@noble/hashes": ^2.4.0
  "@shadcn/react": ^0.3.1
  "@streamdown/code": ^2.0.0
  "@structured-world/structured-zstd": ^0.2.0
  "@types/node": ^24
  "@webgpu/types": ^0.1.74
  blake3-wasm: ^2.1.5
  bson: ^7.3.3
  chdb: ^3.4.0
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cn: ^0.4.0
  effect: ^4.0.6
  gpt-tokenizer: ^4.0.0
  immer: ^11.2.9
  lucide-react: ^1.55.0
  next-themes: ^0.4.6
  react-json-view-lite: ^2.5.0
  react-resizable-panels: ^4.14.4
  shadcn: ^4.21.4
  sonner: ^2.0.8
  streamdown: ^2.7.0
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  uuid: ^14.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vite-plus: 1.0.0-rc.1
  wrangler: ^4.149.0
overrides:
  # The platform package's shared runtime is held on the workspace's `effect` line,
  # rather than to whatever a wider range would resolve to on its own.
  "@effect/platform-node-shared": 4.0.6
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  # The Effect line the workspace is on, taken ahead of the minimum release age so
  # `effect` and the `@effect/*` packages stay on one release.
  - effect@4.0.6
  - "@effect/ai-anthropic@4.0.6"
  - "@effect/ai-openai-compat@4.0.6"
  - "@effect/platform-node@4.0.6"
  - "@effect/platform-node-shared@4.0.6"
  - "@effect/sql-clickhouse@4.0.6"
  - "@effect/vitest@4.0.6"
  - "@fumadocs/base-ui@16.17.3"
  - fumadocs-core@16.17.3
  - immer@11.2.9
allowBuilds:
  # `chdb` states its install script as a no-op and ships its engine as the
  # prebuilt `@chdb/lib-*` package of the platform it runs on, so there is
  # nothing to build.
  chdb: false
  esbuild: true
  # `workerd` ships the Workers runtime binary that `wrangler` runs.
  workerd: true
